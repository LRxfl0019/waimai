server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: sky-take-out
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/sky_take_out;MODE=MySQL;DATABASE_TO_UPPER=false
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    init:
      mode: always

logging:
  level:
    com.liurui.sky: info
