<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>苍穹外卖 | liurui</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft YaHei", sans-serif; background: #f5f7fb; color: #172033; }
    main { max-width: 920px; margin: 0 auto; padding: 56px 20px; }
    h1 { margin: 0 0 12px; font-size: 34px; }
    p { line-height: 1.8; color: #5d687c; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; margin-top: 28px; }
    a { display: block; padding: 22px; border: 1px solid #dfe5f0; border-radius: 8px; background: #fff; color: #172033; text-decoration: none; }
    a strong { display: block; margin-bottom: 8px; font-size: 18px; }
    a span { color: #657187; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>苍穹外卖毕业设计系统</h1>
    <p>作者与演示角色：liurui。系统包含后台管理、用户点餐、H2 持久化数据库、订单流程和统计看板。</p>
    <section class="grid">
      <a href="/admin/">
        <strong>后台管理端</strong>
        <span>分类、菜品、套餐、订单、店铺状态和数据看板。</span>
      </a>
      <a href="/user/">
        <strong>用户点餐端</strong>
        <span>浏览菜单、维护地址、加入购物车并提交订单。</span>
      </a>
      <a href="/h2-console">
        <strong>H2 数据库控制台</strong>
        <span>JDBC URL: jdbc:h2:file:./data/sky_take_out，用户名 sa。</span>
      </a>
    </section>
  </main>
</body>
</html>
